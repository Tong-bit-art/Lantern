name: ImageMagick for macOS 13

# Magick.NET's macOS libraries are built without a deployment target, so they need the macOS of the runner that built
# them (#600: 14.0 on Apple silicon for Magick.NET 14.17.2), and Magick.NET 15 has none for Intel Macs at all. Lantern
# supports macOS 13 on both, so this job builds the same Magick.Native release from its pinned source with
# MACOSX_DEPLOYMENT_TARGET=13.0: ImageMagick's dependencies (ImageMagick/Dependencies, every library at the commit its
# release pins), ImageMagick at the commit Magick.Native pins, then Magick.Native itself. The steps are upstream's own
# (Magick.Native and Dependencies .github/workflows/main.yml), without the prebuilt dependency download.
#
# Run it once per Magick.NET version. Tick "publish" on the run and the dylibs go to a release of this repository, which
# gives them a stable public URL to pin by SHA-256 in build/fetch-magick-native.ps1, which puts them into the macOS
# packages (and next to the Intel test builds). Without "publish" the result is only an artifact, which expires, so a pin
# must never point at one. build/check-macho-minos.py fails the package build if a Magick.NET update brings back a library
# that needs a newer macOS.
#
# Pins for Magick.NET 15.0.0 (Directory.Packages.props): its nuspec commit 79bb870 reads Magick.Native 2026.1010.1943
# (src/Magick.Native/Magick.Native.version), which pins ImageMagick 7.1.2-33 (src/ImageMagick/ImageMagick.commit) and
# downloads Dependencies 2026.10.09.2225 (ImageMagick's .github/build/windows/download-dependencies.sh).
#
# Intel: Magick.Native and Dependencies dropped their macOS x64 build scripts after 14.17.2 (Magick.Native bdd85e2,
# Dependencies d7deb2b) and changed nothing else for macOS. Those scripts come back from the commits just before the
# removal; Dependencies' Apple silicon scripts are the same as the Intel ones but for the Homebrew packages the Intel
# image has, and Magick.Native's settings are the same for both.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the dylibs to a release of this repository (the pins can then point at it).
        type: boolean
        default: false
      tag:
        description: Release tag to publish to, e.g. native-magick-macos-2026.1010.1943.
        type: string
        default: native-magick-macos

permissions:
  contents: read

env:
  MACOSX_DEPLOYMENT_TARGET: '13.0'
  MAGICK_NATIVE_COMMIT: 4dcdad28530c14c8d35687fdeb1ecc8d39b01e30 # tag 2026.1010.1943
  DEPENDENCIES_COMMIT: f586cbad542b5d7f7927c7ebac376e497c869131 # tag 2026.10.09.2225
  # The last commits with the macOS x64 build scripts (the parents of their removal).
  MAGICK_NATIVE_X64_SCRIPTS_COMMIT: 6f191cc4a72c600b795d7a94479a75cf2ee88ffa
  DEPENDENCIES_X64_SCRIPTS_COMMIT: 1c21ff03809da9cc544427fcd04e965d1558d06f # tag 2026.09.26.1516
  QUANTUM: Q8

jobs:
  build:
    name: Magick.Native Q8 ${{ matrix.arch }} (macOS 13.0)
    # One leg at a time, and macos-15 rather than macos-14 for the arm64 build: macos-14 never got a runner
    # here — the leg was cancelled a second after it started with runner_name empty — while
    # macos-15-intel began immediately. portable.yml already uses macos-15/macos-15-intel for the same
    # reason, so these are the two images this repository can actually get.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: write # only used when publish is set: creating the release and uploading to it
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          path: lantern
          persist-credentials: false

      - name: Get pinned sources
        run: |
          fetch() {
            git init -q "$2"
            git -C "$2" fetch -q --depth 1 "https://github.com/$1.git" "$3"
            git -C "$2" checkout -q FETCH_HEAD
          }
          fetch dlemstra/Magick.Native native "$MAGICK_NATIVE_COMMIT"
          fetch ImageMagick/Dependencies dependencies "$DEPENDENCIES_COMMIT"
          fetch ImageMagick/ImageMagick native/src/ImageMagick/ImageMagick "$(< native/src/ImageMagick/ImageMagick.commit)"

      - name: Restore the macOS x64 build scripts
        if: matrix.arch == 'x64'
        run: |
          restore() {
            git -C "$1" fetch -q --depth 1 "https://github.com/$2.git" "$3"
            git -C "$1" checkout -q FETCH_HEAD -- "$4"
          }
          restore native dlemstra/Magick.Native "$MAGICK_NATIVE_X64_SCRIPTS_COMMIT" build/macos-x64
          restore dependencies ImageMagick/Dependencies "$DEPENDENCIES_X64_SCRIPTS_COMMIT" .github/build/macos-x64
          # Stops when upstream has changed the Apple silicon build since, which the restored Intel one would miss.
          diff native/build/macos-arm64/settings.sh native/build/macos-x64/settings.sh
          diff dependencies/.github/build/macos-arm64/build.sh dependencies/.github/build/macos-x64/build.sh

      # Dependencies' install script covers Magick.Native's build tools too; running both fails, as both uninstall
      # the same Homebrew packages.
      # The macos-15 arm64 image ships with a Homebrew whose zstd is missing, and every formula download
      # then fails with:
      #   tried: /opt/homebrew/opt/zstd/lib/libzstd.1.dylib (no such file)
      # Installing zstd through brew cannot work, because brew's own tooling (curl, and whatever else was
      # built against it) refuses to start with the same error, so the download that would install the
      # library never leaves the machine.
      # The cycle is broken by shimming whatever cannot start onto the system copy, which links against
      # system libraries only. Nothing is compiled and no Cellar layout is assumed. x64 uses /usr/local and
      # is unaffected, so this only acts where something is actually broken.
      - name: Repair Homebrew's tools
        run: |
          prefix=$(brew --prefix)
          echo "prefix=$prefix"
          for broken in "$prefix"/Cellar/curl/*/bin/curl "$prefix"/opt/curl/bin/curl; do
            [ -e "$broken" ] || continue
            if "$broken" --version >/dev/null 2>&1; then
              echo "ok: $broken"
              continue
            fi
            echo "::warning::$broken cannot start; replacing it with the system curl"
            rm -f "$broken"
            printf '#!/bin/sh\nexec /usr/bin/curl "$@"\n' > "$broken"
            chmod +x "$broken"
          done
          # Whatever brew shells out to for downloads has to work before anything else can.
          if brew --prefix >/dev/null 2>&1 && /usr/bin/curl --version >/dev/null 2>&1; then
            echo "system curl runs; brew responds"
          else
            echo "::error::Homebrew is not usable on this image"; exit 1
          fi
          # zstd is the one library still missing, and dyld resolves it through /opt/homebrew/opt/zstd.
          # Build it from source with clang (no Homebrew involvement) and put the real file at the exact
          # path dyld asks for. rm -rf first, because opt/zstd may be a dangling symlink and writing through
          # one would silently create the file somewhere else.
          if [ ! -e "$prefix/opt/zstd/lib/libzstd.1.dylib" ]; then
            echo "building zstd: $prefix/opt/zstd/lib/libzstd.1.dylib is missing"
            tmp=$(mktemp -d)
            /usr/bin/curl -fsSL -o "$tmp/zstd.tar.gz" https://github.com/facebook/zstd/releases/download/v1.5.7/zstd-1.5.7.tar.gz
            tar -xzf "$tmp/zstd.tar.gz" -C "$tmp"
            # zstd's lib/Makefile builds the shared library as the target libzstd.<version>.dylib; the
            # target named "lib-release" is a stub with an empty body and produces nothing, which is why an
            # earlier attempt copied a file that was never built.
            make -C "$tmp/zstd-1.5.7/lib" "libzstd.1.5.7.dylib" -j"$(sysctl -n hw.ncpu)" LIBDIR="$prefix/opt/zstd/lib"
            test -f "$tmp/zstd-1.5.7/lib/libzstd.1.5.7.dylib" || { echo "::error::make did not produce libzstd.1.5.7.dylib"; exit 1; }
            rm -rf "$prefix/opt/zstd" "$prefix/Cellar/zstd"
            mkdir -p "$prefix/opt/zstd/lib" "$prefix/lib"
            cp "$tmp/zstd-1.5.7/lib/libzstd.1.5.7.dylib" "$prefix/opt/zstd/lib/libzstd.1.dylib"
            cp "$tmp/zstd-1.5.7/lib/libzstd.1.5.7.dylib" "$prefix/lib/libzstd.1.dylib"
            # A pure copy keeps the install name from LIBDIR, which is the path dyld was already asking for.
            echo "wrote $(ls -lL "$prefix/opt/zstd/lib/libzstd.1.dylib" | wc -l) file(s)"
          else
            echo "zstd already resolvable at $prefix/opt/zstd/lib/libzstd.1.dylib"
          fi
          # Prove it: this is the loader check that was failing.
          /usr/bin/curl --version >/dev/null && echo "curl ok"
          ls -lL "$prefix/opt/zstd/lib/libzstd.1.dylib"

      - name: Install build tools
        working-directory: dependencies
        run: ./.github/build/macos-${{ matrix.arch }}/install.sh

      - name: Clone dependencies
        working-directory: dependencies
        run: ./clone-dependencies.sh macos

      - name: Build dependencies
        working-directory: dependencies
        run: ./.github/build/macos-${{ matrix.arch }}/build.sh

      - name: Build ImageMagick
        working-directory: native/src/ImageMagick/ImageMagick
        run: ../../../build/shared/build.imagemagick.sh macos ${{ matrix.arch }} "$QUANTUM"

      - name: Build Native
        working-directory: native/src/Magick.Native
        run: ../../build/shared/build.native.sh macos ${{ matrix.arch }} "$QUANTUM"

      - name: Copy Native
        working-directory: native/src/Magick.Native
        run: ../../build/shared/copy.native.sh "$GITHUB_WORKSPACE/out" macos ${{ matrix.arch }} "$QUANTUM"

      - name: Check minimum macOS
        run: python3 lantern/build/check-macho-minos.py --max "$MACOSX_DEPLOYMENT_TARGET" out

      - name: Checksum
        working-directory: out
        run: shasum -a 256 * | tee SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: magick-native-${{ env.QUANTUM }}-osx-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

      # Publishes the dylibs to a release of this repository: a stable public URL is what the pins in
      # build/fetch-magick-native.ps1 need, and an artifact URL expires. Off unless asked.
      - name: Publish to a release
        if: ${{ inputs.publish }}
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # Both matrix legs run this at the same time and may both try to create the release; a failure
          # because the other leg won that race is not a failure of this leg.
          if ! gh release view "$TAG" --repo "$REPO" --json assets >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" --title "Native engines $TAG" \
              --notes "Prebuilt native engines this fork pins. Not an application release." --prerelease \
              || gh release view "$TAG" --repo "$REPO" --json assets >/dev/null
          fi
          existing=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name' 2>/dev/null || true)
          for file in out/*; do
            name=$(basename "$file")
            [ "$name" = "SHA256SUMS.txt" ] && continue
            if printf '%s\n' "$existing" | grep -qxF "$name"; then
              gh release upload "$TAG" "$file" --repo "$REPO" --clobber
            else
              gh release upload "$TAG" "$file" --repo "$REPO"
            fi
          done
          echo "::notice::Pin these in build/fetch-magick-native.ps1:"
          for file in out/*; do
            [ "$(basename "$file")" = "SHA256SUMS.txt" ] && continue
            echo "https://github.com/$REPO/releases/download/$TAG/$(basename "$file")"
          done
          cat out/SHA256SUMS.txt
