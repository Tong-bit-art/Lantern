name: Windows ARM64 native

# rhwp has no Windows ARM64 release and Unhwp's NuGet package no win-arm64 library (#236). This builds both on a
# Windows ARM64 runner from their pinned sources (build/build-native.py: the commit of rhwp's release tag, the commit
# Unhwp's nuspec names) with the C runtime linked statically, so they need no Visual C++ Redistributable, and uploads
# them with their SHA-256.
#
# Run it once per rhwp or Unhwp version (Actions > Windows ARM64 native > Run workflow; a pull request that changes the
# build runs it too). Tick "publish" there and the run creates a release and uploads the two files to it, so they have a
# stable public URL; the run prints the URLs to pin in build/fetch-engines.ps1 ($arm64Pins) along with their SHA-256.
# Without "publish" it only stores an artifact, which expires, so a pin must never point at one.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the files to a release of this repository (the pins can then point at it).
        type: boolean
        default: false
      tag:
        description: Release tag to publish to, e.g. native-win-arm64-0.8.7.
        type: string
        default: native-win-arm64
  pull_request:
    paths:
      - .github/workflows/windows-arm64-native.yml
      - build/build-native.py

permissions:
  contents: read

jobs:
  build:
    name: rhwp and Unhwp (win-arm64)
    runs-on: windows-11-arm
    timeout-minutes: 90
    permissions:
      contents: write # only used when publish is set: creating the release and uploading to it
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # An ARM64 Python, so build-native.py can load the ARM64 unhwp.dll to check it.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: arm64

      - name: Check pinned sources
        run: python build/build-native.py check

      - name: Rust
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            $installer = Join-Path $env:RUNNER_TEMP 'rustup-init.exe'
            Invoke-WebRequest https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile $installer
            & $installer -y --profile minimal --default-toolchain none --no-modify-path
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Join-Path $env:USERPROFILE '.cargo\bin' >> $env:GITHUB_PATH
          }

      - name: Build rhwp
        run: python build/build-native.py rhwp --output "$env:RUNNER_TEMP/native/rhwp" --work "$env:RUNNER_TEMP/work"

      - name: Build Unhwp
        run: python build/build-native.py unhwp --output "$env:RUNNER_TEMP/native/unhwp" --work "$env:RUNNER_TEMP/work"

      # The file names build/fetch-engines.ps1 pins: rhwp in the layout of its release archives, Unhwp's library as is.
      - name: Package
        run: |
          $version = { param($name) (Select-String -Path build/build-native.py -Pattern "^$name = `"(.+)`"").Matches[0].Groups[1].Value }
          $out = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'out')
          $rhwp = Join-Path $out "rhwp-v$(& $version RHWP_VERSION)-windows-aarch64.zip"
          $unhwp = Join-Path $out "unhwp-$(& $version UNHWP_VERSION)-win-arm64.dll"
          Compress-Archive -Path "$env:RUNNER_TEMP/native/rhwp/*" -DestinationPath $rhwp
          Copy-Item "$env:RUNNER_TEMP/native/unhwp/unhwp.dll" $unhwp
          # Unhwp's license and the source note go next to the file for whoever hosts it.
          Copy-Item "$env:RUNNER_TEMP/native/unhwp/LICENSE" (Join-Path $out 'unhwp-LICENSE.txt')
          Copy-Item "$env:RUNNER_TEMP/native/unhwp/SOURCE.txt" (Join-Path $out 'unhwp-SOURCE.txt')
          foreach ($file in $rhwp, $unhwp) {
            $name = Split-Path $file -Leaf
            if (-not (Select-String -Path build/fetch-engines.ps1 -SimpleMatch -Pattern "/$name'")) {
              Write-Host "::error::build/fetch-engines.ps1 doesn't pin ${name}: update the url in `$arm64Pins."
              exit 1
            }
          }
          Get-ChildItem $out -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)" } |
            Set-Content (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii
          Get-Content (Join-Path $out 'SHA256SUMS.txt')

      - uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-native
          path: ${{ runner.temp }}/out/
          if-no-files-found: error

      # Publishes the two files to a release of this repository, which is where build/fetch-engines.ps1's
      # $arm64Pins point. A release asset is a stable public URL, so the pins stop depending on a mirror
      # somebody else owns. Off unless asked: a PR that touches the build should not create releases.
      - name: Publish to a release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          $files = Get-ChildItem $env:RUNNER_TEMP\out -File
          $existing = gh release view $env:TAG --json assets --jq '.assets[].name' 2>$null
          if (-not $existing) {
            gh release create $env:TAG --title "Native engines $env:TAG" --notes "Prebuilt native engines this fork pins. Not an application release." --prerelease
          }
          foreach ($file in $files) {
            if ($existing -and $existing -contains $file.Name) {
              gh release upload $env:TAG $file.FullName --clobber
            } else {
              gh release upload $env:TAG $file.FullName
            }
          }
          Write-Host "::notice::Pin these URLs in build/fetch-engines.ps1 (`$arm64Pins):"
          foreach ($file in $files) {
            Write-Host "https://github.com/${{ github.repository }}/releases/download/$env:TAG/$($file.Name)"
          }
          Get-Content (Join-Path $env:RUNNER_TEMP 'out\SHA256SUMS.txt')
