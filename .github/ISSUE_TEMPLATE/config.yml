# Issue routing for a fork. The point of this file is to send people to the right tracker before
# they write a report that nobody here can act on.
blank_issues_enabled: false

contact_links:
  - name: A format or engine problem (report upstream)
    url: https://github.com/KnifeLemon/Filee/issues
    about: This fork does not maintain the format matrix or the conversion engines. If stock Filee would have the same problem, it belongs upstream.

  - name: Ask a question, or share a policy
    url: https://github.com/Tong-bit-art/Lantern/discussions
    about: How rules compose, how to write a policy, showing what you built with it.

  - name: Report a security problem
    url: https://github.com/Tong-bit-art/Lantern/security/advisories/new
    about: Please do not open a public issue for a vulnerability. See SECURITY.md.
