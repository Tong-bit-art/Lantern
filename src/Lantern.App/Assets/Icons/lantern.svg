<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC86B"/>
      <stop offset="0.5" stop-color="#F5A623"/>
      <stop offset="1" stop-color="#D97C0E"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF3D6"/>
      <stop offset="0.45" stop-color="#FFD98A"/>
      <stop offset="1" stop-color="#F2A93B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="#FFF8E7" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFD98A" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#F5A623" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B4636"/>
      <stop offset="1" stop-color="#3A2B20"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#8A5A12" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- warm halo behind the lantern -->
  <circle cx="256" cy="268" r="150" fill="url(#glow)"/>

  <g filter="url(#soft)">
    <!-- top finial and cap -->
    <path d="M238 74 h36 a8 8 0 0 1 0 16 h-36 a8 8 0 0 1 0-16 Z" fill="url(#cap)"/>
    <path d="M200 96 h112 a14 14 0 0 1 14 14 v10 a10 10 0 0 1 -10 10 h-120 a10 10 0 0 1 -10 -10 v-10 a14 14 0 0 1 14 -14 Z" fill="url(#cap)"/>

    <!-- lantern body: a rounded spindle, widest at the middle -->
    <path d="M256 130
             C 312 130, 348 176, 348 258
             C 348 340, 312 386, 256 386
             C 200 386, 164 340, 164 258
             C 164 176, 200 130, 256 130 Z"
          fill="url(#glass)" stroke="url(#body)" stroke-width="14" stroke-linejoin="round"/>

    <!-- inner candle: the light the lantern exists to carry -->
    <path d="M256 232
             C 276 258, 284 276, 284 292
             C 284 310, 271 324, 256 324
             C 241 324, 228 310, 228 292
             C 228 276, 236 258, 256 232 Z"
          fill="url(#body)" opacity="0.9"/>
    <ellipse cx="256" cy="296" rx="12" ry="16" fill="#FFF6DC" opacity="0.85"/>

    <!-- ribs, so the silhouette reads as a lantern and not a bulb -->
    <path d="M256 130 V386" stroke="#E79A2B" stroke-width="7" opacity="0.35" stroke-linecap="round"/>
    <path d="M196 176 C 216 196, 216 320, 196 340" stroke="#E79A2B" stroke-width="6" opacity="0.3" fill="none" stroke-linecap="round"/>
    <path d="M316 176 C 296 196, 296 320, 316 340" stroke="#E79A2B" stroke-width="6" opacity="0.3" fill="none" stroke-linecap="round"/>

    <!-- base -->
    <path d="M196 386 h120 a12 12 0 0 1 12 12 v6 a14 14 0 0 1 -14 14 h-116 a14 14 0 0 1 -14 -14 v-6 a12 12 0 0 1 12 -12 Z" fill="url(#cap)"/>
    <!-- tassel -->
    <path d="M256 418 v22" stroke="url(#body)" stroke-width="9" stroke-linecap="round"/>
    <path d="M256 440 c -14 10, -14 26, 0 34 c 14 -8, 14 -24, 0 -34 Z" fill="url(#body)"/>
  </g>
</svg>
