# Window rules for the Lantern Donut on Hyprland (0.53 to 0.56)
#
# To use this file, add the following line to ~/.config/hypr/hyprland.conf:
#   source = ~/.local/share/lantern/application/hyprland/lantern-donut.conf
# Remove this line before running uninstall.sh to avoid a missing-file warning.
#
# Hyprland 0.57 and newer read ~/.config/hypr/hyprland.lua instead; see INSTALL.txt
# for the Lua rule (hl.window_rule).

windowrule = float 1, match:title ^(Lantern Donut)$
windowrule = move (cursor_x-(window_w*0.5)) (cursor_y-(window_h*0.5)), match:title ^(Lantern Donut)$
windowrule = border_size 0, match:title ^(Lantern Donut)$
windowrule = no_shadow 1, match:title ^(Lantern Donut)$
windowrule = no_blur 1, match:title ^(Lantern Donut)$
